<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globe Vanilla Demo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000010;
        color: #cfd8ff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 12px 14px;
        background: rgba(10, 14, 30, 0.6);
        border: 1px solid rgba(74, 158, 255, 0.4);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.45;
        backdrop-filter: blur(6px);
        max-width: 320px;
      }
      #hud b {
        color: #ffd700;
      }
      #kind-extras-panel {
        position: fixed;
        top: 12px;
        left: 344px;
        width: 280px;
        max-height: calc(100vh - 24px);
        padding: 12px 14px;
        background: rgba(10, 14, 30, 0.6);
        border: 1px solid rgba(74, 158, 255, 0.4);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.45;
        backdrop-filter: blur(6px);
        color: #cfd8ff;
        overflow-y: auto;
        z-index: 4;
      }
      #kind-extras-panel.hidden {
        display: none;
      }
      #kind-extras-panel .kind-extras-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      #kind-extras-panel .kind-extras-title {
        font-weight: 600;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 11px;
      }
      #kind-extras-panel .kind-extras-tag {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        background: rgba(74, 158, 255, 0.2);
        border: 1px solid rgba(74, 158, 255, 0.5);
        color: #cfd8e3;
        letter-spacing: 0.04em;
      }
      #kind-extras-panel .kind-extras-blurb {
        font-size: 11px;
        color: #8aa0c8;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      #kind-extras-panel .kind-extras-section {
        display: none;
      }
      #kind-extras-panel .kind-extras-section.active {
        display: block;
      }
      #studio {
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: 520px;
        padding: 12px 14px;
        background: rgba(10, 14, 30, 0.6);
        border: 1px solid rgba(74, 158, 255, 0.4);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
        color: #cfd8ff;
        backdrop-filter: blur(6px);
        overflow-y: auto;
        z-index: 5;
      }
      #studio h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #ffd700;
      }
      #studio-close {
        position: absolute;
        top: 8px;
        right: 10px;
        background: transparent;
        border: 1px solid rgba(120, 140, 180, 0.4);
        color: #cfd8ff;
        width: 22px;
        height: 22px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        border-radius: 4px;
      }
      #studio-close:hover {
        color: #ffd700;
        border-color: rgba(255, 215, 0, 0.6);
      }
      #studio-open {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 6px 12px;
        background: rgba(10, 14, 30, 0.6);
        border: 1px solid rgba(74, 158, 255, 0.4);
        border-radius: 6px;
        color: #ffd700;
        font-size: 12px;
        font-family: system-ui, sans-serif;
        cursor: pointer;
        backdrop-filter: blur(6px);
        z-index: 5;
      }
      #studio-open:hover {
        border-color: rgba(255, 215, 0, 0.6);
      }
      #studio .studio-actions {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      #studio .studio-actions button {
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        flex: 1;
      }
      #studio .studio-group {
        margin-top: 10px;
        border-top: 1px solid rgba(120, 140, 180, 0.2);
        padding-top: 8px;
      }
      #studio .studio-group-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8aa0c8;
        margin-bottom: 6px;
      }
      #studio .studio-row {
        display: grid;
        grid-template-columns: 1fr 110px 22px;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      #studio .studio-row label {
        font-size: 11px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        color: #b8c5e0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #studio .studio-row input[type='color'] {
        width: 100%;
        height: 22px;
        border: 1px solid rgba(120, 140, 180, 0.4);
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      #studio .studio-row input[type='number'],
      #studio .studio-row input[type='text'] {
        width: 100%;
        padding: 2px 4px;
        font-size: 11px;
        border: 1px solid rgba(120, 140, 180, 0.4);
        background: rgba(0, 0, 0, 0.3);
        color: #cfd8ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      #studio .studio-row .studio-reset {
        padding: 0;
        width: 22px;
        height: 22px;
        font-size: 10px;
        cursor: pointer;
        background: transparent;
        color: #8aa0c8;
        border: 1px solid rgba(120, 140, 180, 0.3);
      }
      #studio .studio-row .studio-reset:hover {
        color: #ffd700;
        border-color: rgba(255, 215, 0, 0.5);
      }
      #studio .studio-row .studio-reset.dirty {
        color: #ffd700;
      }
      .hud-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(120, 140, 180, 0.25);
      }
      .hud-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8aa0c8;
        margin-bottom: 6px;
      }
      .hud-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .hud-row label {
        cursor: pointer;
        flex: 1;
      }
      .hud-row input[type='range'] {
        flex: 1;
      }
      .theme-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .theme-buttons button {
        padding: 4px 8px;
        cursor: pointer;
      }
      .kind-buttons {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .kind-buttons button {
        flex: 1;
        padding: 6px 10px;
        cursor: pointer;
        font-weight: 500;
        background: rgba(30, 38, 56, 0.6);
        border: 1px solid rgba(120, 140, 180, 0.3);
        color: #cfd8e3;
        border-radius: 4px;
      }
      .kind-buttons button.active {
        background: rgba(74, 158, 255, 0.25);
        border-color: #4a9eff;
        color: #ffffff;
      }
      .theme-buttons button.active {
        outline: 2px solid #4a9eff;
        outline-offset: -2px;
      }
      .theme-buttons button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>Globe Core demo</b><br />
      Drag — obrót · Scroll — zoom<br />
      <span id="status">Ładowanie granic państw…</span>

      <div class="hud-section">
        <div class="hud-section-title">Globe kind</div>
        <div class="kind-buttons" id="kind-buttons">
          <button data-kind="outline">Outline</button>
          <button data-kind="dotted">Dotted</button>
          <button data-kind="wireframe">Wireframe</button>
        </div>
        <div class="hud-section-title" style="margin-top: 4px;">Theme variant</div>
        <div class="theme-buttons" id="theme-buttons">
          <button data-theme="outline-dark" data-kind="outline">Dark</button>
          <button data-theme="outline-light" data-kind="outline">Light</button>
          <button data-theme="outline-sunset" data-kind="outline">Sunset</button>
          <button data-theme="outline-cyber" data-kind="outline">Cyber</button>
          <button data-theme="outline-monochrome" data-kind="outline">Mono</button>
          <button data-theme="dotted-dark" data-kind="dotted">Dark</button>
          <button data-theme="wireframe-tron" data-kind="wireframe">Tron</button>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Scene</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-starfield" checked />
          <label for="toggle-starfield">Starfield background</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-html-markers" checked />
          <label for="toggle-html-markers">HTML overlay markers</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-arcs" checked />
          <label for="toggle-arcs">Animated arcs (waw↔nyc↔tyo↔syd)</label>
        </div>
        <div class="hud-row">
          <button id="btn-snapshot" style="padding: 4px 8px; cursor: pointer;">Save PNG snapshot</button>
        </div>
        <div class="hud-row">
          <label for="axis-tilt">Axis tilt</label>
          <input type="range" id="axis-tilt" min="0" max="60" step="0.5" value="23.5" />
          <span id="axis-tilt-value" style="min-width: 3em; text-align: right;">23.5°</span>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Rotation</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-autorotate" checked />
          <label for="toggle-autorotate">Auto-rotate</label>
        </div>
        <div class="hud-row">
          <label for="speed-autorotate">Speed</label>
          <input
            type="range"
            id="speed-autorotate"
            min="0"
            max="2"
            step="0.05"
            value="0.4"
          />
          <span id="speed-value" style="min-width: 2.5em; text-align: right;">0.40</span>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Zoom</div>
        <div class="hud-row">
          <input type="radio" name="zoom-mode" id="zoom-classic" value="classic" />
          <label for="zoom-classic">Classic (radius only)</label>
        </div>
        <div class="hud-row">
          <input type="radio" name="zoom-mode" id="zoom-repel" value="repel" />
          <label for="zoom-repel">Repel — cursor stays anchored</label>
        </div>
        <div class="hud-row">
          <input type="radio" name="zoom-mode" id="zoom-attract" value="attract" checked />
          <label for="zoom-attract">Attract — pulls cursor's point to center</label>
        </div>
        <div class="hud-row" id="zoom-strength-row">
          <label for="zoom-strength">Strength</label>
          <input
            type="range"
            id="zoom-strength"
            min="0"
            max="1"
            step="0.1"
            value="1"
          />
          <span id="zoom-strength-value" style="min-width: 2.5em; text-align: right;">1.0</span>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-smooth-zoom" checked />
          <label for="toggle-smooth-zoom">Smooth zoom</label>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Interactions</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-hover-status" checked />
          <label for="toggle-hover-status">Show hovered country in HUD</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-country-labels" />
          <label for="toggle-country-labels">Country name labels (fade-by-zoom)</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-hover-occlude" checked />
          <label for="toggle-hover-occlude">Hide hover behind globe (occlude back-side)</label>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Country data</div>
        <div class="hud-row">
          <button id="data-nato" style="padding: 4px 8px; cursor: pointer; flex: 1;">NATO</button>
          <button id="data-eu" style="padding: 4px 8px; cursor: pointer; flex: 1;">EU</button>
          <button id="data-g7" style="padding: 4px 8px; cursor: pointer; flex: 1;">G7</button>
          <button id="data-brics" style="padding: 4px 8px; cursor: pointer; flex: 1;">BRICS</button>
        </div>
        <div class="hud-row">
          <button id="data-pop-reds" style="padding: 4px 8px; cursor: pointer; flex: 1;">Population · reds</button>
          <button id="data-pop-viridis" style="padding: 4px 8px; cursor: pointer; flex: 1;">viridis</button>
        </div>
        <div class="hud-row">
          <button id="data-growth" style="padding: 4px 8px; cursor: pointer; flex: 1;">GDP growth · diverging</button>
          <button id="data-clear" style="padding: 4px 8px; cursor: pointer;">Clear</button>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Story</div>
        <div class="hud-row">
          <button id="story-prev" style="padding: 4px 8px; cursor: pointer;">⏮</button>
          <button id="story-play" style="padding: 4px 8px; cursor: pointer; flex: 1;">▶ Play tour</button>
          <button id="story-next" style="padding: 4px 8px; cursor: pointer;">⏭</button>
        </div>
        <div class="hud-row">
          <span id="story-status" style="font-size: 11px; color: #8aa0c8;">No story</span>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Navigation</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-click-to-focus" checked />
          <label for="toggle-click-to-focus">Click country to focus</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-click-to-pin" checked />
          <label for="toggle-click-to-pin">Click also pins as active</label>
        </div>
        <div class="hud-row">
          <button id="btn-fly-home" style="padding: 4px 8px; cursor: pointer;">
            Fly home
          </button>
          <button id="btn-clear-active" style="padding: 4px 8px; cursor: pointer;">
            Unpin
          </button>
        </div>
      </div>
    </div>

    <!--
      Per-kind feature panel — side-by-side with the main HUD. Only the
      section matching the active globe kind is visible at any time, so
      kind-specific knobs don't clutter the global controls.
    -->
    <div id="kind-extras-panel">
      <div class="kind-extras-header">
        <span class="kind-extras-title">Kind FX</span>
        <span class="kind-extras-tag" id="kind-extras-tag">outline</span>
      </div>
      <div class="kind-extras-blurb" id="kind-extras-blurb">
        Visual extras specific to the active globe kind.
      </div>

      <div class="kind-extras-section" data-kind="outline">
        <div class="hud-row">
          <input type="checkbox" id="toggle-outline-glow" checked />
          <label for="toggle-outline-glow">Hover glow halo</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-outline-pulse" checked />
          <label for="toggle-outline-pulse">Focus sonar pulse</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-outline-crosshair" checked />
          <label for="toggle-outline-crosshair">Hover crosshair + readout</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-outline-continent-dim" checked />
          <label for="toggle-outline-continent-dim">Continent dim on hover</label>
        </div>
      </div>

      <div class="kind-extras-section" data-kind="dotted">
        <div class="hud-row">
          <input type="checkbox" id="toggle-dotted-ripple" checked />
          <label for="toggle-dotted-ripple">Click ripple wave</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-dotted-flash" checked />
          <label for="toggle-dotted-flash">Data-change flash</label>
        </div>
      </div>

      <div class="kind-extras-section" data-kind="wireframe">
        <div class="hud-row">
          <input type="checkbox" id="toggle-wireframe-clickpulse" checked />
          <label for="toggle-wireframe-clickpulse">Click pulse along grid</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-wireframe-emphasis" checked />
          <label for="toggle-wireframe-emphasis">Equator + tropics emphasis</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-wireframe-glitch" checked />
          <label for="toggle-wireframe-glitch">CRT glitch transients</label>
        </div>
      </div>
    </div>

    <div id="studio" style="display: none;">
      <button id="studio-close" title="Close panel">×</button>
      <h3>Theme Studio</h3>
      <div class="studio-actions">
        <button id="studio-reset-all">Reset all</button>
        <button id="studio-export">Export JSON</button>
      </div>
      <div id="studio-body"></div>
    </div>
    <button id="studio-open" title="Open Theme Studio">⚙ Theme Studio</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
