<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globe Vanilla Demo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000010;
        color: #cfd8ff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 12px 14px;
        background: rgba(10, 14, 30, 0.6);
        border: 1px solid rgba(74, 158, 255, 0.4);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.45;
        backdrop-filter: blur(6px);
        max-width: 320px;
      }
      #hud b {
        color: #ffd700;
      }
      #studio {
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: 520px;
        padding: 12px 14px;
        background: rgba(10, 14, 30, 0.6);
        border: 1px solid rgba(74, 158, 255, 0.4);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
        color: #cfd8ff;
        backdrop-filter: blur(6px);
        overflow-y: auto;
        z-index: 5;
      }
      #studio h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #ffd700;
      }
      #studio .studio-actions {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      #studio .studio-actions button {
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        flex: 1;
      }
      #studio .studio-group {
        margin-top: 10px;
        border-top: 1px solid rgba(120, 140, 180, 0.2);
        padding-top: 8px;
      }
      #studio .studio-group-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8aa0c8;
        margin-bottom: 6px;
      }
      #studio .studio-row {
        display: grid;
        grid-template-columns: 1fr 110px 22px;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      #studio .studio-row label {
        font-size: 11px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        color: #b8c5e0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #studio .studio-row input[type='color'] {
        width: 100%;
        height: 22px;
        border: 1px solid rgba(120, 140, 180, 0.4);
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      #studio .studio-row input[type='number'],
      #studio .studio-row input[type='text'] {
        width: 100%;
        padding: 2px 4px;
        font-size: 11px;
        border: 1px solid rgba(120, 140, 180, 0.4);
        background: rgba(0, 0, 0, 0.3);
        color: #cfd8ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      #studio .studio-row .studio-reset {
        padding: 0;
        width: 22px;
        height: 22px;
        font-size: 10px;
        cursor: pointer;
        background: transparent;
        color: #8aa0c8;
        border: 1px solid rgba(120, 140, 180, 0.3);
      }
      #studio .studio-row .studio-reset:hover {
        color: #ffd700;
        border-color: rgba(255, 215, 0, 0.5);
      }
      #studio .studio-row .studio-reset.dirty {
        color: #ffd700;
      }
      .hud-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(120, 140, 180, 0.25);
      }
      .hud-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8aa0c8;
        margin-bottom: 6px;
      }
      .hud-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .hud-row label {
        cursor: pointer;
        flex: 1;
      }
      .hud-row input[type='range'] {
        flex: 1;
      }
      .theme-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .theme-buttons button {
        padding: 4px 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>Globe Core demo</b><br />
      Drag — obrót · Scroll — zoom<br />
      <span id="status">Ładowanie granic państw…</span>

      <div class="hud-section">
        <div class="hud-section-title">Theme</div>
        <div class="theme-buttons">
          <button data-theme="outline-dark">Dark</button>
          <button data-theme="outline-light">Light</button>
          <button data-theme="outline-sunset">Sunset</button>
          <button data-theme="outline-cyber">Cyber</button>
          <button data-theme="outline-monochrome">Mono</button>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Rotation</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-autorotate" checked />
          <label for="toggle-autorotate">Auto-rotate</label>
        </div>
        <div class="hud-row">
          <label for="speed-autorotate">Speed</label>
          <input
            type="range"
            id="speed-autorotate"
            min="0"
            max="2"
            step="0.05"
            value="0.4"
          />
          <span id="speed-value" style="min-width: 2.5em; text-align: right;">0.40</span>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Zoom</div>
        <div class="hud-row">
          <input type="radio" name="zoom-mode" id="zoom-classic" value="classic" />
          <label for="zoom-classic">Classic (radius only)</label>
        </div>
        <div class="hud-row">
          <input type="radio" name="zoom-mode" id="zoom-repel" value="repel" />
          <label for="zoom-repel">Repel — cursor stays anchored</label>
        </div>
        <div class="hud-row">
          <input type="radio" name="zoom-mode" id="zoom-attract" value="attract" checked />
          <label for="zoom-attract">Attract — pulls cursor's point to center</label>
        </div>
        <div class="hud-row" id="zoom-strength-row">
          <label for="zoom-strength">Strength</label>
          <input
            type="range"
            id="zoom-strength"
            min="0"
            max="1"
            step="0.1"
            value="1"
          />
          <span id="zoom-strength-value" style="min-width: 2.5em; text-align: right;">1.0</span>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-smooth-zoom" checked />
          <label for="toggle-smooth-zoom">Smooth zoom</label>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Interactions</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-hover-status" checked />
          <label for="toggle-hover-status">Show hovered country in HUD</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-hover-occlude" checked />
          <label for="toggle-hover-occlude">Hide hover behind globe (occlude back-side)</label>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-section-title">Navigation</div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-click-to-focus" checked />
          <label for="toggle-click-to-focus">Click country to focus</label>
        </div>
        <div class="hud-row">
          <input type="checkbox" id="toggle-click-to-pin" checked />
          <label for="toggle-click-to-pin">Click also pins as active</label>
        </div>
        <div class="hud-row">
          <button id="btn-fly-home" style="padding: 4px 8px; cursor: pointer;">
            Fly home
          </button>
          <button id="btn-clear-active" style="padding: 4px 8px; cursor: pointer;">
            Unpin
          </button>
        </div>
      </div>
    </div>
    <div id="studio">
      <h3>Theme Studio</h3>
      <div class="studio-actions">
        <button id="studio-reset-all">Reset all</button>
        <button id="studio-export">Export JSON</button>
      </div>
      <div id="studio-body"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
