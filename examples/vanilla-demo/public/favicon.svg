      <stop offset="0%" stop-color="#fff5d4"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>
  <!-- Glow halo so the icon reads at 16px even on dark Safari toolbars. -->
